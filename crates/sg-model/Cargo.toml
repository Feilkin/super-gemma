[package]
name = "sg-model"
description = "Gemma 4 forward graph (prefill/decode), sampling, CPU reference model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Use the int8-MMQ GEMM for the FFN up/down projections in prefill (Q8 activation
# quant + Q4_0-reading int8 gemm). Off by default — the f16 gemm path. Gate for
# A/B + the perplexity check of activation-Q8 accuracy (STATUS rank #2).
int8-ffn = []

[dependencies]
half = "2.7.1"
rayon = "1.12.0"
sg-gguf = { version = "0.1.0", path = "../sg-gguf" }
sg-gpu = { version = "0.1.0", path = "../sg-gpu" }
thiserror = "2.0.18"

[dev-dependencies]
serde_json = "1.0.150"
sg-tokenizer = { path = "../sg-tokenizer" }
