[package]
name = "sg-gpu"
description = "Vulkan compute runtime: device, buffers, WGSL->SPIR-V kernel library, command graphs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Bench targets are listed explicitly below; with them disabled during the ash
# migration, stop cargo auto-discovering benches/*.rs (they still use vulkano).
autobenches = false

[lints]
workspace = true

[dependencies]
ash = "0.38"
bytemuck = { version = "1.25.0", features = ["derive"] }
half = "2.7.1"
thiserror = "2.0.18"

[build-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in", "spv-out"] }
naga_oil = "0.22.0"

[dev-dependencies]
criterion = "0.8.2"
sg-gguf = { path = "../sg-gguf" }
# Kept only for the not-yet-migrated microbenches (their [[bench]] targets are
# disabled below until they are converted to the ash recording API — see
# docs/ash-migration-rationale.md "Follow-up").
vulkano = "0.35.2"

