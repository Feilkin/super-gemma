[package]
name = "sg-gpu"
description = "Vulkan compute runtime: device, buffers, WGSL->SPIR-V kernel library, command graphs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
half = "2.7.1"
thiserror = "2.0.18"
vulkano = "0.35.2"

[build-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in", "spv-out"] }
naga_oil = "0.22.0"

[dev-dependencies]
criterion = "0.8.2"
sg-gguf = { path = "../sg-gguf" }

[[bench]]
name = "gemv_bw"
harness = false

[[bench]]
name = "gemm_tflops"
harness = false

[[bench]]
name = "attn_us"
harness = false
