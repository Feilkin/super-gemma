[package]
name = "sg-gguf"
description = "GGUF parsing, model description validation, Q4_0 types, weight source"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
half = { version = "2.7.1", features = ["bytemuck"] }
memmap2 = "0.9.10"
thiserror = "2.0.18"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "weight_load"
harness = false
